<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Kopano Madisa</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/body-of-work/assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root { --paper:#f4f0e8; --ink:#171310; --accent:#b0562f; --muted:#8b8074;
      --display:"Cormorant Garamond", Georgia, serif; --sans:"Jost", system-ui, sans-serif; }
    * { margin:0; box-sizing:border-box; }
    body { min-height:100svh; display:grid; place-items:center; text-align:center;
      background:var(--paper); color:var(--ink); font-family:var(--sans); font-weight:300; padding:2rem; }
    .mark { width:52px; height:52px; margin:0 auto 2rem; display:grid; place-items:center;
      border:1px solid var(--ink); border-radius:50%; font-family:var(--display); font-size:1.2rem; }
    h1 { font-family:var(--display); font-weight:300; font-size:clamp(4rem, 18vw, 12rem); line-height:.9; letter-spacing:-.02em; }
    h1 em { font-style:italic; color:var(--accent); }
    p { margin:1.4rem auto 2.4rem; max-width:38ch; color:var(--muted); font-size:1.05rem; }
    a.btn { display:inline-block; padding:.85rem 1.7rem; border:1px solid var(--ink); border-radius:999px;
      text-decoration:none; color:var(--ink); font-size:.8rem; letter-spacing:.12em; text-transform:uppercase;
      transition:background .3s, color .3s; }
    a.btn:hover { background:var(--ink); color:var(--paper); }
  </style>
</head>
<body>
  <main>
    <div class="mark">KM</div>
    <h1>4<em>0</em>4</h1>
    <p>This page has left the frame. The work, however, is still hanging.</p>
    <a class="btn" href="/body-of-work/">Back to the gallery</a>
  </main>
</body>
</html>
